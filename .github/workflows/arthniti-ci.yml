name: ArthNiti CI

on:
  push:
    branches: [main]
    paths:
      - "projects/arthniti-india-macro-simulator/**"
      - ".github/workflows/arthniti-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/arthniti-india-macro-simulator/**"
      - ".github/workflows/arthniti-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/arthniti-india-macro-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/arthniti-india-macro-simulator/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: ruff check src tests --select E,F,UP --ignore E402,E501
      - name: Tests and coverage
        run: pytest --cov=arthniti --cov-report=term-missing --cov-fail-under=75
