[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arthniti-macro"
version = "0.1.0"
description = "Reproducible macroeconomic simulation and forecast evaluation for India."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hemanth Nomula" }]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "matplotlib>=3.8,<4",
                "requests>=2.31,<3", "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1", "httpx>=0.27,<1"]

[project.scripts]
arthniti = "arthniti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
